# 代码对比扫描工具 — 配置文件示例
# 使用: python main.py --config scan.yaml

# === 仓库配置 ===
# 本地仓库路径 或 GitLab URL
repo: /path/to/your/java/project

# === 对比版本 ===
# 旧版本（基准版本）: commit SHA / 分支名 / tag
old_ref: main
# 新版本（提测版本）: commit SHA / 分支名 / tag
new_ref: develop

# === 输出配置 ===
# 报告输出目录
output: ./reports

# === 分析配置 ===
# 是否启用 Java 变更影响分析 (jcci)
impact_analysis: true

# === 其他 ===
# 是否保留临时 clone 的仓库（默认自动清理）
keep_temp: false
