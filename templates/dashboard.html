<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代码对比平台 - HRAS测试部</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #F5F6F7;
  color: #1F2329;
  font-size: 14px;
  line-height: 22px;
  min-height: 100vh;
}

/* ===== 侧边菜单 ===== */
.sidebar {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 224px;
  background: #fff;
  border-right: 1px solid #E5E6EB;
  display: flex; flex-direction: column;
  z-index: 100;
}
.sidebar .logo {
  height: 56px;
  display: flex; align-items: center;
  padding: 0 16px;
  font-size: 16px; font-weight: 600; color: #1F2329;
  border-bottom: 1px solid #F2F3F5;
  gap: 8px;
}
.sidebar .logo .logo-icon {
  width: 28px; height: 28px; border-radius: 6px;
  background: #0E66FB; color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; flex: 0 0 auto;
}
.menu { padding: 8px; flex: 1; overflow-y: auto; }
.menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px;
  border-radius: 4px;
  color: #4E5969;
  cursor: pointer;
  margin-bottom: 2px;
  transition: all .15s;
}
.menu-item:hover { background: #F2F3F5; color: #1F2329; }
.menu-item.active { background: #EEF2FF; color: #0E66FB; font-weight: 500; }
.menu-item .menu-icon { width: 18px; text-align: center; flex: 0 0 auto; }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid #F2F3F5;
  font-size: 12px; line-height: 18px; color: #86909C;
}

/* ===== 顶部栏 ===== */
.topbar {
  position: fixed; left: 224px; right: 0; top: 0;
  height: 56px;
  background: #fff;
  border-bottom: 1px solid #E5E6EB;
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  z-index: 90;
}
.topbar .platform-name { font-size: 14px; font-weight: 500; color: #4E5969; }
.topbar-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #86909C; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #52C41A; display: inline-block; }

/* ===== 内容区 ===== */
.content { margin-left: 224px; padding: 76px 20px 24px; }
.breadcrumb { font-size: 12px; line-height: 18px; color: #86909C; margin-bottom: 4px; }
.page-title { font-size: 20px; font-weight: 600; line-height: 28px; color: #1F2329; margin-bottom: 16px; }

/* ===== 统计卡片 ===== */
.stats-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card {
  flex: 1; min-width: 190px;
  background: #fff;
  border: 1px solid #E5E6EB;
  border-radius: 8px;
  padding: 16px;
  display: flex; align-items: center; gap: 12px;
}
.stat-card .stat-icon {
  width: 44px; height: 44px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex: 0 0 auto;
}
.stat-card .stat-label { font-size: 12px; line-height: 18px; color: #86909C; }
.stat-card .stat-value { font-size: 20px; font-weight: 600; line-height: 28px; color: #1F2329; }

/* ===== 卡片 ===== */
.card {
  background: #fff;
  border-radius: 8px;
  border: 1px solid #E5E6EB;
  margin-bottom: 16px;
}
.card-header {
  padding: 13px 16px;
  border-bottom: 1px solid #F2F3F5;
  font-size: 16px; font-weight: 600; line-height: 24px;
  color: #1F2329;
  display: flex; align-items: center; justify-content: space-between;
}
.card-header .card-extra { font-size: 12px; font-weight: 400; color: #86909C; }
.card-body { padding: 16px; }

/* ===== 表单 ===== */
.form-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.form-group { flex: 1; min-width: 160px; }
.form-group label {
  display: block;
  font-size: 14px; font-weight: 500; line-height: 22px;
  color: #4E5969;
  margin-bottom: 6px;
}
.form-group input, .form-group select {
  width: 100%; height: 34px;
  padding: 5px 12px;
  border: 1px solid #E5E6EB;
  border-radius: 4px;
  font-size: 14px; line-height: 22px;
  color: #1F2329;
  background: #fff;
  font-family: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.form-group input:focus, .form-group select:focus {
  outline: none;
  border-color: #0E66FB;
  box-shadow: 0 0 0 2px rgba(14,102,251,.12);
}
.form-group input::placeholder { color: #86909C; }

/* ===== 按钮 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 16px;
  border-radius: 4px;
  font-size: 14px; line-height: 22px;
  font-family: inherit;
  cursor: pointer;
  border: 1px solid transparent;
  transition: all .15s;
  white-space: nowrap;
}
.btn-primary { background: #0E66FB; border-color: #0E66FB; color: #fff; }
.btn-primary:hover { background: #036DDE; border-color: #036DDE; }
.btn-primary:disabled { background: #C9CDD4; border-color: #C9CDD4; cursor: not-allowed; }
.btn-default { background: #fff; border-color: #E5E6EB; color: #1F2329; }
.btn-default:hover { border-color: #9DB8FD; color: #0E66FB; }
.btn-sm { height: 26px; padding: 0 10px; font-size: 12px; line-height: 20px; }
.btn-block { width: 100%; }

/* ===== 状态提示 ===== */
.status {
  margin-top: 12px;
  padding: 8px 12px;
  border-radius: 4px;
  font-size: 14px;
  display: none;
}
.status.info { display: block; background: #E6F4FF; color: #0958D9; }
.status.success { display: block; background: #F6FFED; color: #389E0D; }
.status.error { display: block; background: #FFF1F0; color: #CF1322; }
.status a { color: #0E66FB; font-weight: 500; text-decoration: none; }
.status a:hover { color: #036DDE; }

/* ===== 表格 ===== */
.table-wrap { overflow-x: auto; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.data-table th {
  text-align: left;
  padding: 13px 16px;
  background: #F2F3F5;
  color: #1F2329;
  font-weight: 500;
  border-bottom: 1px solid #E5E6EB;
  white-space: nowrap;
}
.data-table td {
  padding: 13px 16px;
  border-bottom: 1px solid #F2F3F5;
  vertical-align: middle;
  color: #1F2329;
}
.data-table tbody tr:hover td { background: #FAFBFC; }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table .num { font-variant-numeric: tabular-nums; }
.data-table .stat-add { color: #389E0D; }
.data-table .stat-del { color: #CF1322; }
.data-table .aux-text { color: #86909C; font-size: 12px; }

/* ===== 标签 ===== */
.tag {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
  font-size: 12px; line-height: 20px;
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  vertical-align: middle;
}
.tag-default { background: #F2F3F5; color: #4E5969; }
.tag-blue { background: #E6F4FF; color: #0958D9; }
.tag-green { background: #F6FFED; color: #389E0D; }
.tag-red { background: #FFF1F0; color: #CF1322; }
.tag-orange { background: #FFFBE6; color: #D48806; }
.arrow-sep { color: #86909C; margin: 0 4px; }

/* ===== 链接按钮 ===== */
.link-btn {
  color: #0E66FB; cursor: pointer;
  background: none; border: none;
  font-size: 14px; font-family: inherit; padding: 0;
  text-decoration: none;
}
.link-btn:hover { color: #036DDE; }

/* ===== 空态 ===== */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #86909C;
  font-size: 14px;
}
.empty-state .icon { font-size: 40px; margin-bottom: 8px; }

/* ===== 复选 ===== */
.checkbox-row { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
.checkbox-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; color: #4E5969;
  cursor: pointer;
}
.checkbox-label input { accent-color: #0E66FB; width: 14px; height: 14px; cursor: pointer; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><span class="logo-icon">📊</span>代码对比平台</div>
  <div class="menu">
    <div class="menu-item active" data-view="compare" onclick="switchView('compare')">
      <span class="menu-icon">🔍</span>代码对比
    </div>
    <div class="menu-item" data-view="reports" onclick="switchView('reports')">
      <span class="menu-icon">📄</span>报告列表
    </div>
  </div>
  <div class="sidebar-footer">HRAS测试部 · 代码对比工具</div>
</div>

<div class="topbar">
  <div class="platform-name">HRAS测试部代码对比平台</div>
  <div class="topbar-right">
    <span style="color:#4E5969;">局域网访问:</span>
    <a id="lan-url" href="#" target="_blank" style="color:#0E66FB;text-decoration:none;">检测中...</a>
    <span style="margin-left:8px;">|</span>
    <span class="status-dot" id="server-dot"></span>
    <span id="server-text">检测服务中...</span>
  </div>
</div>

<div class="content">

  <!-- ============ 代码对比视图 ============ -->
  <div id="view-compare">
    <div class="breadcrumb">HRAS测试部 / 代码对比</div>
    <div class="page-title">代码对比</div>

    <!-- 统计卡片 -->
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-icon" style="background:#EEF2FF;">📊</div>
        <div>
          <div class="stat-label">累计对比次数</div>
          <div class="stat-value" id="stat-count">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#F6FFED;">📁</div>
        <div>
          <div class="stat-label">累计变更文件</div>
          <div class="stat-value" id="stat-files">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#E6F4FF;">➕</div>
        <div>
          <div class="stat-label">累计新增代码行</div>
          <div class="stat-value" id="stat-insertions">0</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon" style="background:#FFF1F0;">➖</div>
        <div>
          <div class="stat-label">累计删除代码行</div>
          <div class="stat-value" id="stat-deletions">0</div>
        </div>
      </div>
    </div>

    <!-- 新建对比 -->
    <div class="card">
      <div class="card-header">新建对比<span class="card-extra">基线版本将自动拉取远程最新代码</span></div>
      <div class="card-body">
        <div class="form-row">
          <div class="form-group" style="flex:1.5;min-width:200px;">
            <label>仓库</label>
            <div style="display:flex;gap:8px;">
              <select id="repo-select" style="flex:1;" onchange="onRepoChange()">
                <option value="">发现仓库中...</option>
              </select>
              <button class="btn btn-default btn-sm" style="height:34px;" onclick="discoverRepos()" title="重新扫描仓库">🔄</button>
            </div>
            <input type="text" id="repo" placeholder="手动输入仓库路径" style="margin-top:8px;display:none;">
          </div>
          <div class="form-group">
            <label>基线版本</label>
            <select id="old-ref" style="min-width:140px;" onchange="onBaseChange()">
              <option value="master" selected>master</option>
            </select>
            <input type="text" id="old-ref-manual" placeholder="输入分支名/tag/commit" style="margin-top:8px;display:none;min-width:140px;">
          </div>
          <div class="form-group">
            <label>对比版本</label>
            <div style="display:flex;gap:8px;">
              <select id="new-ref" style="flex:1;">
                <option value="">— 选择分支 —</option>
              </select>
              <button class="btn btn-default btn-sm" style="height:34px;" onclick="loadBranches()" title="刷新分支">🔄</button>
            </div>
          </div>
          <div class="form-group" style="flex:0 0 auto;min-width:auto;">
            <button class="btn btn-primary" id="scan-btn" onclick="startScan()">🔍 开始对比</button>
          </div>
        </div>
        <div class="checkbox-row">
          <label class="checkbox-label"><input type="checkbox" id="full-context" checked> 完整文件上下文</label>
          <label class="checkbox-label"><input type="checkbox" id="enable-impact" checked> Java 影响分析</label>
        </div>
        <div id="status" class="status"></div>
      </div>
    </div>

    <!-- 最近对比记录 -->
    <div class="card">
      <div class="card-header">最近对比记录<span class="card-extra">最近 10 条</span></div>
      <div class="table-wrap" id="history-content">
        <div class="empty-state"><div class="icon">📭</div>暂无对比记录</div>
      </div>
    </div>
  </div>

  <!-- ============ 报告列表视图 ============ -->
  <div id="view-reports" style="display:none;">
    <div class="breadcrumb">HRAS测试部 / 报告列表</div>
    <div class="page-title">报告列表</div>
    <div class="card">
      <div class="card-header">生成的对比报告<span class="card-extra">自动保留最近 10 份</span></div>
      <div class="table-wrap" id="reports-content">
        <div class="empty-state"><div class="icon">📄</div>暂无报告</div>
      </div>
    </div>
  </div>

</div>

<script>
var POLL_INTERVAL = 3000;

/* ── 视图切换 ── */
function switchView(view) {
  document.querySelectorAll('.menu-item').forEach(function(item) {
    item.classList.toggle('active', item.getAttribute('data-view') === view);
  });
  document.getElementById('view-compare').style.display = view === 'compare' ? 'block' : 'none';
  document.getElementById('view-reports').style.display = view === 'reports' ? 'block' : 'none';
  if (view === 'reports') loadReports();
}

/* ── 服务状态检测 ── */
function checkServerStatus() {
  fetch('/status')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('server-dot').style.background = '#52C41A';
      document.getElementById('server-text').textContent = '服务运行中';
      var lanEl = document.getElementById('lan-url');
      if (data.lan_url) {
        lanEl.textContent = data.lan_url;
        lanEl.href = data.lan_url;
      }
    })
    .catch(function() {
      document.getElementById('server-dot').style.background = '#FF4D4F';
      document.getElementById('server-text').textContent = '服务不可用';
      document.getElementById('lan-url').textContent = '不可用';
    });
}

function getRepoPath() {
  var sel = document.getElementById('repo-select');
  var input = document.getElementById('repo');
  if (input.style.display !== 'none' && input.value.trim()) {
    return input.value.trim();
  }
  return sel.value || '';
}

function onRepoChange() {
  var sel = document.getElementById('repo-select');
  var input = document.getElementById('repo');
  if (sel.value === '__manual__') {
    input.style.display = 'block'; input.focus(); input.value = '';
  } else if (sel.value && sel.value !== '__manual__') {
    input.style.display = 'none'; input.value = '';
    loadBranches();
  }
}

function onBaseChange() {
  var sel = document.getElementById('old-ref');
  var input = document.getElementById('old-ref-manual');
  if (sel.value === '__manual__') {
    input.style.display = 'block'; input.focus(); input.value = '';
  } else {
    input.style.display = 'none'; input.value = '';
  }
}

function discoverRepos() {
  var sel = document.getElementById('repo-select');
  sel.innerHTML = '<option value="">扫描仓库中...</option>';
  fetch('/repos')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var repos = data.repos || [];
      sel.innerHTML = '';
      if (repos.length === 0) {
        sel.innerHTML = '<option value="">— 未发现仓库 —</option>';
      } else {
        repos.forEach(function(r) {
          sel.innerHTML += '<option value="' + r.path + '">' + r.name + '</option>';
        });
      }
      sel.innerHTML += '<option value="__manual__">✏️ 手动输入...</option>';
      if (data.default_path) sel.value = data.default_path;
      if (sel.value) loadBranches();
    })
    .catch(function(err) { sel.innerHTML = '<option value="">— 加载失败 —</option>'; });
}

function showStatus(msg, type) {
  var el = document.getElementById('status');
  el.className = 'status ' + (type || 'info');
  el.innerHTML = msg;
}

function loadBranches() {
  var repo = getRepoPath();
  if (!repo) { showStatus('请先选择或输入仓库路径', 'error'); return; }
  var baseSel = document.getElementById('old-ref');
  var newSel = document.getElementById('new-ref');
  var prevBase = baseSel.value || 'master';
  var prevNew = newSel.value || '';
  baseSel.innerHTML = '<option value="">加载中...</option>';
  newSel.innerHTML = '<option value="">加载中...</option>';
  fetch('/branches?repo=' + encodeURIComponent(repo))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.success) {
        var branches = data.branches;
        baseSel.innerHTML = '<option value="">— 选择基线分支 (' + branches.length + ' 个) —</option>';
        newSel.innerHTML = '<option value="">— 选择对比分支 (' + branches.length + ' 个) —</option>';
        branches.forEach(function(b) {
          baseSel.innerHTML += '<option value="' + b + '">' + b + '</option>';
          newSel.innerHTML += '<option value="' + b + '">' + b + '</option>';
        });
        baseSel.innerHTML += '<option value="__manual__">✏️ 手动输入...</option>';
        newSel.innerHTML += '<option value="__manual__">✏️ 手动输入...</option>';
        // 恢复之前选中的值
        if (branches.indexOf(prevBase) >= 0) baseSel.value = prevBase;
        else if (prevBase === 'master') baseSel.value = 'master';
        if (branches.indexOf(prevNew) >= 0) newSel.value = prevNew;
        showStatus('已加载 ' + branches.length + ' 个分支', 'success');
        fetch('/config', { method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'repo=' + encodeURIComponent(repo)
        }).catch(function(){});
      } else {
        baseSel.innerHTML = '<option value="">— 加载失败 —</option>';
        newSel.innerHTML = '<option value="">— 加载失败 —</option>';
        showStatus('❌ ' + data.error, 'error');
      }
    })
    .catch(function(err) {
      baseSel.innerHTML = '<option value="">— 网络错误 —</option>';
      newSel.innerHTML = '<option value="">— 网络错误 —</option>';
      showStatus('❌ 无法连接: ' + err.message, 'error');
    });
}

function startScan() {
  var repo = getRepoPath();
  var baseSel = document.getElementById('old-ref');
  var old = baseSel.value === '__manual__'
    ? document.getElementById('old-ref-manual').value.trim()
    : baseSel.value.trim();
  var newRef = document.getElementById('new-ref').value;
  var full = document.getElementById('full-context').checked ? '1' : '0';
  var impact = document.getElementById('enable-impact').checked ? '1' : '0';

  if (!repo || !old) {
    showStatus('请填写仓库路径并选择基线版本', 'error');
    return;
  }

  var btn = document.getElementById('scan-btn');
  btn.disabled = true;
  btn.textContent = '⏳ 扫描中...';
  showStatus('正在启动扫描...', 'info');

  fetch('/scan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'repo=' + encodeURIComponent(repo)
      + '&old=' + encodeURIComponent(old)
      + '&new=' + encodeURIComponent(newRef)
      + '&impact=' + impact
      + '&full=' + full
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.task_id) {
        showStatus('⏳ 扫描进行中，请稍候...', 'info');
        pollStatus(data.task_id);
      } else {
        btn.disabled = false; btn.textContent = '🔍 开始对比';
        showStatus('❌ 启动失败: ' + (data.error || '未知错误'), 'error');
      }
    })
    .catch(function(err) {
      btn.disabled = false; btn.textContent = '🔍 开始对比';
      showStatus('❌ 请求失败: ' + err.message, 'error');
    });
}

function pollStatus(taskId) {
  fetch('/scan-status?task_id=' + encodeURIComponent(taskId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.status === 'done') {
        var btn = document.getElementById('scan-btn');
        btn.disabled = false; btn.textContent = '🔍 开始对比';
        showStatus('✅ 扫描完成！<a href="' + data.report_url + '" target="_blank">📄 打开新报告</a>', 'success');
        loadHistory();
      } else if (data.status === 'error') {
        var btn = document.getElementById('scan-btn');
        btn.disabled = false; btn.textContent = '🔍 开始对比';
        showStatus('❌ 扫描失败: ' + data.message, 'error');
      } else {
        if (data.message) showStatus('⏳ ' + data.message, 'info');
        setTimeout(function() { pollStatus(taskId); }, POLL_INTERVAL);
      }
    })
    .catch(function(err) {
      setTimeout(function() { pollStatus(taskId); }, POLL_INTERVAL);
    });
}

/* ── 历史记录 + 统计卡片 ── */
function loadHistory() {
  fetch('/scan-history')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var history = data.history || [];
      // 更新统计卡片
      var files = 0, ins = 0, del = 0;
      history.forEach(function(h) {
        files += h.files_changed || 0;
        ins += h.insertions || 0;
        del += h.deletions || 0;
      });
      document.getElementById('stat-count').textContent = history.length;
      document.getElementById('stat-files').textContent = files;
      document.getElementById('stat-insertions').textContent = ins;
      document.getElementById('stat-deletions').textContent = del;

      var container = document.getElementById('history-content');
      if (history.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📭</div>暂无对比记录</div>';
        return;
      }
      var html = '<table class="data-table"><thead><tr>'
        + '<th>对比版本</th><th>仓库</th><th>变更文件</th><th>新增</th><th>删除</th><th>对比时间</th><th style="text-align:right;">操作</th>'
        + '</tr></thead><tbody>';
      history.forEach(function(h) {
        var cleanNew = (h.new_ref || '').replace(/^origin\//, '');
        var cleanOld = (h.old_ref || '').replace(/^origin\//, '');
        html += '<tr>'
          + '<td><span class="tag tag-default">' + cleanOld + '</span><span class="arrow-sep">→</span><span class="tag tag-blue">' + cleanNew + '</span></td>'
          + '<td>' + (h.repo_name || '') + '</td>'
          + '<td class="num">' + (h.files_changed || 0) + '</td>'
          + '<td class="num stat-add">+' + (h.insertions || 0) + '</td>'
          + '<td class="num stat-del">-' + (h.deletions || 0) + '</td>'
          + '<td class="aux-text">' + (h.generated_at || '') + '</td>'
          + '<td style="text-align:right;"><a class="link-btn" href="' + h.report_url + '" target="_blank">📄 查看报告</a></td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    })
    .catch(function() {});
}

/* ── 报告列表 ── */
function formatSize(bytes) {
  if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + ' MB';
  if (bytes >= 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return bytes + ' B';
}

function loadReports() {
  fetch('/reports-list')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var reports = data.reports || [];
      var container = document.getElementById('reports-content');
      if (reports.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📄</div>暂无报告</div>';
        return;
      }
      var html = '<table class="data-table"><thead><tr>'
        + '<th>报告文件</th><th>生成时间</th><th>大小</th><th style="text-align:right;">操作</th>'
        + '</tr></thead><tbody>';
      reports.forEach(function(rp) {
        html += '<tr>'
          + '<td>' + rp.filename + '</td>'
          + '<td class="aux-text">' + rp.time + '</td>'
          + '<td class="aux-text">' + formatSize(rp.size) + '</td>'
          + '<td style="text-align:right;"><a class="link-btn" href="/reports/' + rp.filename + '" target="_blank">📄 查看报告</a></td>'
          + '</tr>';
      });
      html += '</tbody></table>';
      container.innerHTML = html;
    })
    .catch(function() {});
}

(function() {
  checkServerStatus();
  discoverRepos();
  loadHistory();
})();
</script>
